name: opennext-build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Enable pnpm
        run: npm i -g pnpm@12.4.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
        env:
          CI: 'true'
      - name: Add OpenNext adapter
        run: pnpm add -D @opennextjs/cloudflare@latest
        env:
          CI: 'true'
      - name: Build OpenNext bundle
        run: pnpm exec opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          KEY_VAULTS_SECRET: ${{ secrets.KEY_VAULTS_SECRET }}
          NEXT_PUBLIC_SERVICE_MODE: client
          NEXT_AUTH_SECRET: ${{ secrets.KEY_VAULTS_SECRET }}
          CI: 'true'
      - name: Package
        run: tar -czf opennext.tgz .open-next
      - uses: actions/upload-artifact@v4
        with:
          name: opennext-bundle
          path: opennext.tgz
          retention-days: 3
